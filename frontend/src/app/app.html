<header class="encabezado">
  <h1>Conciliador de facturas y retenciones</h1>
  <p>Cruza las facturas de proveedores contra los registros contabilizados e identifica inconsistencias.</p>
</header>

<main>
  <app-carga-archivos [cargando]="cargando()" (procesar)="procesar($event)" />

  @if (cargando()) {
    <div class="mensaje info" role="status">Procesando archivos…</div>
  }
  @if (error(); as mensaje) {
    <div class="mensaje error" role="alert">{{ mensaje }}</div>
  }
  @if (resultado(); as r) {
    <app-resumen-cards [resumen]="r.resumen" />
    <app-tabla-resultados [detalle]="r.detalle" />
  }
</main>
